Record:
  type: object
  required:
    - status
    - reason
  properties:
    status:
      type: string
      enum:
        - draft
        - active
        - closed
    kind:
      type: string
      const: published
    amount:
      type: number
      exclusiveMinimum: 10
      exclusiveMaximum: 500
    free: false
    blocked: true
    label:
      $ref: "#/Label"
      maxLength: 8
    tuple:
      type: array
      prefixItems:
        - type: string
        - type: integer
          minimum: 1
      items: false
    reason:
      type: string
      description: Required decision reason
  patternProperties:
    ^x-:
      type: string
      minLength: 2
  if:
    properties:
      status:
        const: closed
    required:
      - status
  then:
    properties:
      amount:
        minimum: 20
  example:
    status: active
    kind: published
    amount: 100
    reason: Approved
    label: Demo
    tuple:
      - demo
      - 2
Label:
  type: string
  minLength: 2
  pattern: ^[A-Za-z]+$
