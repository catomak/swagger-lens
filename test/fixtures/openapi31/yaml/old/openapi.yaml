openapi: 3.1.2
info:
  title: OpenAPI 3.1 fixture
  version: 1.0.0
  description: Shared schemas nested five levels deep, JSON Schema 2020-12 constraints, and a webhook.
servers:
  - url: http://127.0.0.1:8788
    description: Local fixture server
paths:
  /records:
    get:
      operationId: listRecords
      summary: List records
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    post:
      operationId: createRecord
      summary: Create a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Envelope"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /records/{id}:
    get:
      operationId: getRecord
      summary: Get a record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /legacy/status:
    get:
      operationId: legacyStatus
      summary: Operation removed in the new contract
      responses:
        "204":
          description: No content
  /health:
    get:
      operationId: health
      summary: Unchanged health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              example:
                status: ok
webhooks:
  record.changed:
    post:
      operationId: recordChanged
      summary: Record changed notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Envelope"
      responses:
        "204":
          description: Acknowledged
components:
  schemas:
    Envelope:
      $ref: ./schemas/envelope.yaml#/Envelope
    Payload:
      $ref: ./schemas/envelope.yaml#/Payload
    Meta:
      $ref: ./schemas/envelope.yaml#/Meta
    Details:
      $ref: ./schemas/envelope.yaml#/Details
    Record:
      $ref: ./schemas/record.yaml#/Record
    Label:
      $ref: ./schemas/record.yaml#/Label
