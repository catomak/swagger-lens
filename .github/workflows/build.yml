name: Build and test VSIX

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
          cache: npm
      - run: npm ci
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Build, inspect, install and test the VSIX
        if: runner.os != 'Linux'
        run: npm run release -- --target ${{ matrix.target }}
      - name: Build and test with a virtual Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run release -- --target ${{ matrix.target }}
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: builds/*-${{ matrix.target }}.vsix
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.target }}
          path: |
            builds/reports/*.json
            .build/**/vscode-test/logs/**
          if-no-files-found: warn
