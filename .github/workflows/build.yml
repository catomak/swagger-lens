name: Build and test VSIX

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the current version's existing GitHub release to Marketplace without rebuilding
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_marketplace
    name: ${{ matrix.artifact || matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            artifact: macos-arm64
            runner: macos-15
          - target: darwin-x64
            artifact: macos-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
          cache: npm
      - name: Validate release metadata
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.cjs --tag "$RELEASE_TAG"
      - run: npm ci
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Build, inspect, install and test the VSIX
        if: runner.os != 'Linux'
        run: npm run release -- --target ${{ matrix.target }}
      - name: Build and test with a virtual Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run release -- --target ${{ matrix.target }}
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.artifact || matrix.target }}
          path: builds/*-${{ matrix.artifact || matrix.target }}.vsix
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.artifact || matrix.target }}
          path: |
            builds/reports/*.json
            .build/**/vscode-test/logs/**
          if-no-files-found: warn

  github-release:
    name: Publish GitHub release
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: release-assets
      - name: Prepare notes and verified assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.cjs --tag "$RELEASE_TAG" --output release-notes.md
          node scripts/release-assets.cjs prepare "$RELEASE_TAG" release-assets
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-draft.txt; then
            if [ "$(cat release-draft.txt)" = false ]; then
              gh release download "$RELEASE_TAG" --dir existing-release --pattern '*.vsix' --pattern SHA256SUMS
              node scripts/release-assets.cjs verify "$RELEASE_TAG" existing-release
              echo "The complete release already exists; keeping its published assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --draft --title "Swagger Lens $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.vsix release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "Swagger Lens $RELEASE_TAG" --notes-file release-notes.md

  marketplace:
    name: Publish VS Code Marketplace
    needs: github-release
    if: >-
      always() && !cancelled() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.github-release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_marketplace)
      )
    environment: marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: marketplace-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Select the published version
        env:
          TAG_REF: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          release_tag="${TAG_REF:-$(node -p "'v' + require('./package.json').version")}"
          node scripts/release-notes.cjs --tag "$release_tag"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download the published release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.vsix' --pattern SHA256SUMS
      - name: Verify the published assets
        run: node scripts/release-assets.cjs verify "$RELEASE_TAG" release-assets
      - name: Sign in to Microsoft Entra ID with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Resolve the Marketplace identity
        run: |
          if ! az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv 2> identity-error.txt; then
            cat identity-error.txt >&2
            if [[ "$(cat identity-error.txt)" == *ProfileDoesNotExistException* ]]; then
              echo "::error::Register Swagger Lens Marketplace in an Azure DevOps organization connected to the same Entra tenant: Organization Settings > Users > Add users. See docs/release.md."
            fi
            exit 1
          fi
      - name: Publish all six packages with Microsoft Entra ID
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: node scripts/release-assets.cjs publish "$RELEASE_TAG" release-assets
